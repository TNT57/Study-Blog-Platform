# CI = Continuous Integration.
# On every pull request and every push to main, GitHub runs these checks
# on a fresh Linux machine. If one step fails, the PR shows a red cross.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# If you push to a PR again while CI is still running, cancel the old run.
# Runs on main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow can only read the repo (principle of least privilege).
permissions:
  contents: read

# Every action is pinned to a full commit SHA, not a tag like "v7".
# A tag can be moved to different code later; a SHA can't. Dependabot still updates them.
jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostgreSQL 17 just for this run (a "service container").
    # It starts empty every time, so tests always begin from zero.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: study # a throwaway database, not a real secret
          POSTGRES_DB: study_blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study_blog_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://study:study@localhost:5432/study_blog_test

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't keep the GitHub token on disk after checkout (we never push from CI).
          persist-credentials: false

      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (exact versions from pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint (no warnings allowed)
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Tests (unit + database)
        run: pnpm test

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Its own empty PostgreSQL, like the check job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: study # a throwaway database, not a real secret
          POSTGRES_DB: study_blog_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study_blog_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://study:study@localhost:5432/study_blog_e2e

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Chromium browser for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Create the tables and the demo user
        run: pnpm db:migrate && pnpm db:seed

      - name: Build
        run: pnpm build

      # playwright.config.ts starts `pnpm start` itself, then a real browser clicks through the app.
      - name: End-to-end tests
        run: pnpm test:e2e

      # When a test fails, keep the report (with screenshots and a step-by-step trace) for 7 days.
      - name: Save the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  commits:
    name: Commit messages
    # Only PRs have a list of new commits to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code (full history, so we can see every PR commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Git hook checks messages on your laptop, but "git commit --no-verify"
      # skips it. This step checks them again where nobody can skip it.
      - name: Check every commit message in this PR (Conventional Commits)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
